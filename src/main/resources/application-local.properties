# Local development profile: run the app on the host against the Docker Compose services
# (compose.yaml: postgres on 5432, ollama on 11434). Matches scripts/start-local.sh.
spring.datasource.url=jdbc:postgresql://localhost:5432/rageval
spring.datasource.username=rageval
spring.datasource.password=rageval

# Local-only deployment mode (spec 23): bind to loopback so the API — which serves client content
# in reports and review contexts, with no authentication layer — is never reachable from the
# network. Remove this line only for a deliberately shared deployment you have secured otherwise.
server.address=127.0.0.1
