databaseChangeLog:
  - changeSet:
      id: 010-01-test-execution-attempt-count
      author: workbench
      comment: >-
        Spec 8.1 requires persisting at minimum the final attempt count and last error per
        invocation. The adapter has reported attemptCount since Phase 2; Phase 3's orchestrator
        now persists it on the execution row. Nullable because pre-existing rows and executions
        that never reached the adapter (e.g. CANCELLED while PENDING) have no attempt count.
      changes:
        - addColumn:
            tableName: test_execution
            columns:
              - column:
                  name: attempt_count
                  type: INT
  - changeSet:
      id: 010-02-test-execution-attempt-count-check
      author: workbench
      changes:
        - sql:
            sql: >-
              ALTER TABLE test_execution
              ADD CONSTRAINT chk_execution_attempt_count_positive
              CHECK (attempt_count IS NULL OR attempt_count > 0);
      rollback:
        - sql:
            sql: ALTER TABLE test_execution DROP CONSTRAINT chk_execution_attempt_count_positive;
