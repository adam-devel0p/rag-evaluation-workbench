spring.application.name=rag-evaluation-workbench

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Global target-invocation limits (per-target timeouts/redirects live on TargetSystem itself).
rag-evaluation.target.maximum-response-bytes=2097152
rag-evaluation.target.retry.maximum-attempts=2
rag-evaluation.target.retry.initial-backoff=200ms
rag-evaluation.target.retry.backoff-multiplier=2.0

