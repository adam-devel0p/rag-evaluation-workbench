spring.application.name=rag-evaluation-workbench

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Pin Hibernate's JSONB mapper to Jackson 3 ("jackson3" = Jackson3JsonFormatMapper.SHORT_NAME).
# All JSONB entity fields are Jackson 3 types (tools.jackson JsonNode). Hibernate auto-detects
# the mapper from the classpath and prefers Jackson 2 when its databind is present — which it is
# since springdoc (swagger-core) arrived in Phase 8. Without this pin every JSONB read breaks
# with "Could not deserialize string to java type: tools.jackson.databind.JsonNode".
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# Bounded run-execution worker pool (spec 15/25). Per-target maximum concurrency lives on each
# TargetSystem row, not here.
rag-evaluation.execution.worker-count=2
rag-evaluation.execution.queue-capacity=100
rag-evaluation.execution.default-repetitions=3
rag-evaluation.execution.shutdown-grace-seconds=30

# Global target-invocation limits (per-target timeouts/redirects live on TargetSystem itself).
rag-evaluation.target.maximum-response-bytes=2097152
rag-evaluation.target.retry.maximum-attempts=2
rag-evaluation.target.retry.initial-backoff=200ms
rag-evaluation.target.retry.backoff-multiplier=2.0

# Evaluator defaults (spec 25); every value can be overridden per run via
# EvaluationRun.evaluatorConfiguration (see EvaluatorSettingsFactory for the override keys).
# Refusal/uncertainty phrase lists and human-review tags keep their code defaults from
# EvaluatorProperties unless overridden here.
rag-evaluation.evaluator.human-review-confidence-threshold=0.70
rag-evaluation.evaluator.maximum-context-characters=30000
rag-evaluation.evaluator.mandatory-evaluators=transport,required-facts,forbidden-claims
rag-evaluation.evaluator.maximum-acceptable-latency-milliseconds=2000
rag-evaluation.evaluator.citation-policy=OPTIONAL
rag-evaluation.evaluator.refusal-answer-tail-characters=160

# Local LLM judge (spec 12) — environment-driven, conservative defaults. No model is required for
# the application to compile or start; when Ollama is unreachable the LLM evaluators degrade to
# metric-status FAILED (never a chatbot failure) and deterministic evaluators keep working.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
rag-evaluation.llm.model=${OLLAMA_EVALUATOR_MODEL:llama3.2:3b}
rag-evaluation.llm.temperature=${OLLAMA_TEMPERATURE:0.0}
rag-evaluation.llm.maximum-concurrency=${OLLAMA_MAX_CONCURRENCY:2}
# Fail fast when the judge is down: no client-side retries (Spring AI's max-attempts feeds
# RetryPolicy.maxRetries, so 0 = single attempt). Degradation to FAILED metric results is the
# recovery path (replay re-evaluates once Ollama is back) — with 8 LLM evaluators per execution,
# the default retry-with-backoff would multiply into minutes of stalled run time whenever Ollama
# is unreachable. The shrunk backoff interval is a safety net in case retries are re-enabled.
spring.ai.retry.max-attempts=0
spring.ai.retry.backoff.initial-interval=100ms
# Privacy (spec 23): never export prompt/completion content through model observations. These are
# the Spring AI defaults, pinned here so an accidental override is visible in review.
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false

# What captured target content is persisted (spec 23/25); see StorageProperties for the
# consequences of turning either off. Applied at capture time in RunStateService.
rag-evaluation.storage.store-raw-responses=true
rag-evaluation.storage.store-retrieved-chunk-content=true

# Development-only opt-in (spec 23): when true, the target adapter and judge client log full
# payloads/prompts at DEBUG. Never enable outside local development — see ContentLoggingProperties.
rag-evaluation.logging.verbose-content=false

# Observability (spec 24). Exactly the four spec-listed endpoints are exposed over HTTP.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=RAG Evaluation Workbench
info.app.description=Independent black-box evaluation of external chatbots and RAG systems
# Structured logs (spec 24): the trailing %X{...} block prints the MDC context — correlationId
# (every HTTP request), runId/executionId/targetSystemId (worker threads), evaluatorKey
# (evaluation loop) — so every statement carries its identifiers without logging content.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} [cid=%X{correlationId:-} run=%X{runId:-} exec=%X{executionId:-} target=%X{targetSystemId:-} eval=%X{evaluatorKey:-}] : %m%n

# OpenAPI (spec 29): springdoc 3.x (Spring Boot 4 line). JSON at /v3/api-docs, UI at /swagger-ui.
springdoc.swagger-ui.path=/swagger-ui

